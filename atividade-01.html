<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 01</title>
</head>
<body>
    <h3>Carros Elétricos</h3>
    <form action="atividade.html">
        <p>
        <label for="inome" >Nome completo:</label><br>
        <input type="text" name="nome" id="inome" required minlength="8" maxlength="30" size="30" placeholder="Digite seu nome completo" autocomplete="username">
        </p>
        <p>
        <label for="isen">Modelo de carro elétrico favorito: </label><br>
        <input type="text" name="modelo" id="imodelo" required minlength="8" maxlength="20" size="30" placeholder="Ex: Tesla Model 3" autocomplete="username">
        </p>
        <p>
        <label for="isen">Crie uma senha de acesso: </label><br>
        <input type="password" name="sen" id="isen" required minlength="6" maxlength="20" size="15" placeholder="Mínimo 6 caracteres" autocomplete="current-password">
        </p>
        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>

    </form>
    
</body>
</html>
